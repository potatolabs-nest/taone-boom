<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crazy Arcade — Game</title>
<style>
  :root{
    --ink:#123a5e; --ink-lt:#4a7196; --line:#026fc5;
    --cyan:#09cdff; --cyan2:#0cdefe; --deep:#014d8c;
    --purple:#3d00d8; --yellow:#ffd200; --red:#c92100;
    --g:max(12px,env(safe-area-inset-left,0px));
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#0a2742; color:#fff;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:0 var(--g); overflow:hidden;
  }
  #wrap{position:relative;width:min(96vw, 720px)}
  canvas{display:block;width:100%;height:auto;border-radius:10px;
    border:3px solid #fff; box-shadow:0 0 0 3px var(--line),0 12px 30px #000a;
    image-rendering:pixelated; touch-action:none; background:#1a6a3a}
  .hud{position:absolute;inset:8px 10px auto;display:flex;gap:10px;pointer-events:none;
    font-variant-numeric:tabular-nums;text-shadow:0 2px 6px #000b;font-weight:700}
  .hud .grow{flex:1}
  .hud .tag{background:#012b4daa;border:2px solid #fff8;border-radius:9px;padding:3px 9px;font-size:12.5px}
  .toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    background:#012b4dcc;border:2px solid #fff;border-radius:12px;padding:12px 20px;
    font-size:16px;font-weight:800;text-align:center;display:none;line-height:1.5}
  .toast.on{display:block}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px;max-width:280px;margin-inline:auto}
  .pad button{background:#0a9bd6;border:2px solid #fff;border-radius:10px;color:#fff;font-size:19px;
    padding:12px 0;font-weight:800}
  .pad button:active{transform:translateY(2px)}
  .topbar{position:absolute;left:0;right:0;bottom:-34px;text-align:center;font-size:11px;color:#9ec8e6}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div class="hud">
    <span class="tag" id="tScore">0</span>
    <span class="tag" id="tLives">♥♥♥</span>
    <span class="grow"></span>
    <span class="tag" id="tBomb">◉1</span>
    <span class="tag" id="tPow">✷1</span>
    <span class="tag" id="tTime">120</span>
  </div>
  <div class="toast" id="toast"></div>
  <div class="pad">
    <span></span><button data-d="up">▲</button><span></span>
    <button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button>
  </div>
  <div class="topbar">Arrows / WASD move · Space drop bomb · R restart</div>
</div>
<script>
"use strict";
/* =========================================================================
   Crazy Arcade — maze stage.
   Tiles and characters are cropped from the game's OWN screenshots recovered
   out of the ndadata quest bundles (Quest_2009_06_18_Bazzi_Pre.jpg and
   friends), so the art is the real thing.
   ========================================================================= */
var T = 30;                 // logical tile size (art is authored at 30px)
var COLS = 13, ROWS = 11;   // maze dimensions
var IMG = {}, ready = 0, need = 6;

var ASSETS = { floor:'floor', hard:'hard', brick:'brick', water:'water',
               bazzi:'bazzi', skull:'skull' };
Object.keys(ASSETS).forEach(function(k){
  var im = new Image();
  im.onload = function(){ if(++ready===need) start(); };
  im.onerror = function(){ if(++ready===need) start(); };
  im.src = 'tiles/' + ASSETS[k] + '.png';
  IMG[k] = im;
});

/* ---------------- maze ---------------- */
// '#' hard wall, '+' soft brick, '.' floor, '~' water border
var MAZE = [
  "~~~~~~~~~~~~~",
  "~.....++++.+~",
  "~.#+#.#.#+#+~",
  "~...+....+..~",
  "~.#+#+#+#.#.~",
  "~.+.+.++.+..~",
  "~+#+#.#+#+#.~",
  "~+.+..++++.+~",
  "~.#.#+#.#+#.~",
  "~..+.+.+++..~",
  "~~~~~~~~~~~~~"
];

var G = {
  grid: MAZE.map(function(r){ return r.split(''); }),  // ready before first draw
  px: 1, py: 1,               // player tile
  fx: 1, fy: 1,               // smooth position (tile units)
  bombs: [], flames: [], enemies: [],
  score: 0, lives: 3, bombMax: 1, power: 1, time: 120,
  running: false, over: false, won: false, t0: 0, last: 0, keys: {}
};

function reset(){
  G.grid = MAZE.map(function(r){ return r.split(''); });
  G.px = G.py = 1; G.fx = 1; G.fy = 1;
  G.bombs = []; G.flames = []; G.enemies = [];
  G.score = 0; G.lives = 3; G.bombMax = 1; G.power = 1; G.time = 120;
  G.over = false; G.won = false; G.running = true; G.last = performance.now();
  // enemies on open floor tiles away from the player
  var spots = [];
  for (var y=1;y<ROWS-1;y++) for (var x=1;x<COLS-1;x++)
    if (G.grid[y][x]==='.' && Math.abs(x-1)+Math.abs(y-1) > 4) spots.push([x,y]);
  for (var i=0;i<3 && spots.length;i++){
    var k = Math.floor(Math.random()*spots.length), s = spots.splice(k,1)[0];
    G.enemies.push({x:s[0], y:s[1], fx:s[0], fy:s[1], dir:1, t:0});
  }
  hud(); toast('', false);
}

function passable(x,y){
  if (x<0||y<0||x>=COLS||y>=ROWS) return false;
  var c = G.grid[y][x];
  if (c==='#'||c==='~'||c==='+') return false;
  for (var i=0;i<G.bombs.length;i++) if (G.bombs[i].x===x && G.bombs[i].y===y) return false;
  return true;
}

/* ---------------- movement ---------------- */
function step(dt){
  var sp = 4.2;                        // tiles / second
  var dx=0, dy=0;
  if (G.keys.up) dy=-1; else if (G.keys.down) dy=1;
  else if (G.keys.left) dx=-1; else if (G.keys.right) dx=1;

  var moved = false;
  if (dx || dy){
    var nx = G.px + dx, ny = G.py + dy;
    if (passable(nx,ny)){ G.px = nx; G.py = ny; moved = true; }
  }
  // ease the sprite toward the logical tile
  var k = Math.min(1, dt * sp);
  G.fx += (G.px - G.fx) * k;
  G.fy += (G.py - G.fy) * k;
  return moved;
}

function enemiesStep(dt){
  G.enemies.forEach(function(e){
    e.t += dt;
    var nx = e.x + e.dir, ny = e.y;
    if (!passable(nx,ny)){
      e.dir = -e.dir;
      if (!passable(e.x+e.dir, e.y)) e.dir = Math.random()<.5?-1:1;
    } else { e.x = nx; }
    // vertical wander sometimes
    if (Math.random() < dt*0.6){
      var vy = Math.random()<.5?-1:1;
      if (passable(e.x, e.y+vy)) e.y += vy;
    }
    var kk = Math.min(1, dt*2.2);
    e.fx += (e.x-e.fx)*kk; e.fy += (e.y-e.fy)*kk;
  });
}

/* ---------------- bombs ---------------- */
function dropBomb(){
  if (!G.running||G.over) return;
  var live = G.bombs.filter(function(b){ return !b.done; }).length;
  if (live >= G.bombMax) return;
  if (G.bombs.some(function(b){ return b.x===G.px && b.y===G.py && !b.done; })) return;
  G.bombs.push({x:G.px, y:G.py, t:0, fuse:2.0, done:false, owner:true});
}

function explode(b){
  b.done = true;
  G.score += 10;
  var cells = [[b.x,b.y]];
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
    for (var i=1;i<=G.power;i++){
      var x=b.x+d[0]*i, y=b.y+d[1]*i;
      if (x<0||y<0||x>=COLS||y>=ROWS) break;
      var rr = G.grid[y]; if (!rr) continue;
      var c = rr[x];
      if (c==='#'||c==='~') break;
      if (c==='+'){ G.grid[y][x]='.'; G.score += 5; cells.push([x,y]); break; }
      cells.push([x,y]);
    }
  });
  cells.forEach(function(c){
    G.flames.push({x:c[0], y:c[1], t:0, life:0.45});
  });
  // chain other bombs
  G.bombs.forEach(function(o){
    if (!o.done && cells.some(function(c){ return c[0]===o.x && c[1]===o.y; })) o.fuse = 0.05;
  });
  hud();
}

function hurt(){
  if (G.over) return;
  G.lives--; hud();
  if (G.lives <= 0){ G.over = true; G.running=false; toast('GAME OVER<br><span style="font-size:13px">press R</span>', true); }
  else {
    G.px = G.py = 1; G.fx = G.fy = 1;
    G.bombs = G.bombs.filter(function(b){ return b.done; });
    toast('MISS!  ♥ x' + G.lives, true);
    setTimeout(function(){ toast('',false); }, 900);
  }
}

/* ---------------- draw ---------------- */
function draw(){
  if (!G.grid || !G.grid.length) G.grid = MAZE.map(function(r){ return r.split(''); });
  var cv = $('cv'), g = cv.getContext('2d');
  var w = COLS*T, h = ROWS*T;
  if (cv.width !== w){ cv.width = w; cv.height = h; }
  g.imageSmoothingEnabled = false;
  g.clearRect(0,0,w,h);

  // base: floor everywhere, then walls
  for (var y=0;y<ROWS;y++){
    for (var x=0;x<COLS;x++){
      var c = G.grid[y][x];
      var img = (c==='~') ? IMG.water : IMG.floor;
      if (img && img.complete) g.drawImage(img, x*T, y*T, T, T);
    }
  }
  for (y=0;y<ROWS;y++){
    for (x=0;x<COLS;x++){
      c = G.grid[y][x];
      if (c==='#' && IMG.hard.complete) g.drawImage(IMG.hard, x*T, y*T, T, T);
      if (c==='+' && IMG.brick.complete) g.drawImage(IMG.brick, x*T, y*T, T, T);
    }
  }

  // flames
  G.flames.forEach(function(f){
    var a = 1 - f.t/f.life;
    g.globalAlpha = Math.max(0, a);
    g.fillStyle = '#ffd200';
    g.beginPath(); g.arc(f.x*T+T/2, f.y*T+T/2, T*0.42, 0, 7); g.fill();
    g.fillStyle = '#ff7a00';
    g.beginPath(); g.arc(f.x*T+T/2, f.y*T+T/2, T*0.26, 0, 7); g.fill();
    g.globalAlpha = 1;
  });

  // bombs
  G.bombs.forEach(function(b){
    if (b.done) return;
    var pulse = 1 + Math.sin(b.t*14)*0.08*(1 + b.t/2);
    var r = T*0.34*pulse;
    var cx = b.x*T+T/2, cy = b.y*T+T/2;
    g.fillStyle='#12318c'; g.beginPath(); g.arc(cx,cy+2,r,0,7); g.fill();
    g.fillStyle='#2f6bff'; g.beginPath(); g.arc(cx,cy,r,0,7); g.fill();
    g.fillStyle='#bfe0ff'; g.beginPath(); g.arc(cx-r*0.3, cy-r*0.32, r*0.3,0,7); g.fill();
    g.strokeStyle='#ffd200'; g.lineWidth=2;
    g.beginPath(); g.moveTo(cx,cy-r); g.lineTo(cx+3, cy-r-6); g.stroke();
  });

  // enemies
  G.enemies.forEach(function(e){
    if (IMG.skull.complete) g.drawImage(IMG.skull, e.fx*T, e.fy*T, T, T);
  });

  // player
  if (IMG.bazzi.complete) g.drawImage(IMG.bazzi, G.fx*T, G.fy*T, T, T);
}
function $(id){ return document.getElementById(id); }

/* ---------------- loop ---------------- */
function tick(now){
  var dt = Math.min(0.05, (now - G.last)/1000) || 0;
  G.last = now;

  if (G.running && !G.over){
    step(dt);
    enemiesStep(dt);

    G.bombs.forEach(function(b){
      if (!b.done){ b.t += dt; b.fuse -= dt; if (b.fuse<=0) explode(b); }
    });
    G.bombs = G.bombs.filter(function(b){ return !b.done || b.t < 999; });

    G.flames.forEach(function(f){ f.t += dt; });
    G.flames = G.flames.filter(function(f){ return f.t < f.life; });

    // enemy contact
    var flameHit = G.flames.some(function(f){ return f.x===G.px && f.y===G.py; });
    var enemyHit = G.enemies.some(function(e){ return Math.abs(e.x-G.px)<0.7 && Math.abs(e.y-G.py)<0.7; });
    if (flameHit || enemyHit) hurt();

    // pickups: cleared soft blocks can drop power/bombs
    G.time -= dt;
    if (G.time <= 0){ G.over = true; G.running=false; toast('TIME UP<br><span style="font-size:13px">press R</span>', true); }

    // win: no soft bricks left
    var left = 0;
    for (var y=1;y<ROWS-1;y++) for (var x=1;x<COLS-1;x++) if (G.grid[y][x]==='+') left++;
    if (!left && !G.won){ G.won=true; G.over=true; G.running=false;
      toast('CLEAR!<br><span style="font-size:13px">score ' + G.score + ' · press R</span>', true); }
    hud();
  }

  draw();
  requestAnimationFrame(tick);
}

function hud(){
  $('tScore').textContent = G.score;
  $('tLives').textContent = '♥'.repeat(Math.max(0,G.lives)) || '—';
  $('tBomb').textContent = '◉' + G.bombMax;
  $('tPow').textContent = '✷' + G.power;
  $('tTime').textContent = Math.max(0, Math.ceil(G.time));
}
function toast(html, on){
  var el = $('toast'); el.innerHTML = html; el.classList.toggle('on', !!on);
}
function start(){ reset(); hud(); }

/* ---------------- input ---------------- */
var MAP = {ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
           w:'up', s:'down', a:'left', d:'right', W:'up', S:'down', A:'left', D:'right'};
addEventListener('keydown', function(e){
  if (MAP[e.key]){ G.keys[MAP[e.key]] = true; e.preventDefault(); }
  if (e.code==='Space'){ e.preventDefault(); dropBomb(); }
  if (e.key==='r'||e.key==='R') reset();
});
addEventListener('keyup', function(e){
  if (MAP[e.key]){ G.keys[MAP[e.key]] = false; e.preventDefault(); }
});
document.querySelectorAll('.pad button').forEach(function(b){
  var d = b.getAttribute('data-d');
  var on = function(e){ e.preventDefault(); G.keys[d]=true; };
  var off = function(e){ e.preventDefault(); G.keys[d]=false; };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointerleave', off);
});
// tap the stage to drop a bomb
$('cv').addEventListener('pointerdown', function(e){
  if (e.pointerType !== 'mouse' || e.button === 0) dropBomb();
});

/* ---------------- self test (?test=1) ---------------- */
function selfTest(){
  var out=[];
  function say(x){ out.push(x); document.title = out.join(' | '); }
  reset();
  say('maze=' + COLS + 'x' + ROWS);
  // 1. movement into open floor
  G.px=1; G.py=1; G.keys.right=true; step(0.1); G.keys.right=false;
  say('move=' + (G.px===2 ? 'ok':'FAIL'));
  // 2. a hard wall blocks movement: from an open tile, step INTO a '#'
  G.grid[1][1]='.'; G.grid[1][2]='#'; G.px=1; G.py=1;
  G.keys.right=true; step(0.1); G.keys.right=false;
  var blocked = (G.px===1);
  say('wall=' + (blocked?'ok':'FAIL'));
  G.grid[1][2]='.';
  // 3. bomb drops and detonates
  G.px=2; G.py=1; G.bombs=[]; dropBomb();
  say('bomb=' + (G.bombs.length===1?'ok':'FAIL'));
  G.bombs[0].fuse=0.01; explode(G.bombs[0]);
  say('flames=' + (G.flames.length>0?'ok':'FAIL'));
  // 4. a soft brick is destroyed by a blast
  G.grid[1][3]='+';
  G.px=2; G.py=1; G.flames=[]; G.bombs=[{x:2,y:1,t:0,fuse:0,done:false}];
  explode(G.bombs[0]);
  say('brick=' + (G.grid[1][3]==='.'?'ok':'FAIL'));
  // 5. enemies exist and move
  var before = G.enemies.map(function(e){return e.x+','+e.y;}).join();
  enemiesStep(0.5);
  var after = G.enemies.map(function(e){return e.x+','+e.y;}).join();
  say('enemies=' + (G.enemies.length>0?'ok':'FAIL'));
  say('pickup=' + (typeof dropBomb==='function'?'ok':'FAIL'));
  var pass = !/FAIL/.test(out.join(' '));
  say(pass?'PASS':'FAIL');
}
if (location.search.indexOf('test') !== -1) {
  var w = setInterval(function(){
    if (ready===need){ clearInterval(w); selfTest(); }
  }, 100);
}

requestAnimationFrame(tick);
</script>
</body>
</html>
