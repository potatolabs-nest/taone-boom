<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club Audition Asset Browser</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#666;--card:#f5f5f5;--line:#ddd;--accent:#2b6cb0}
@media (prefers-color-scheme:dark){:root{--bg:#111417;--fg:#e8eaed;--muted:#9aa0a6;--card:#1b1f24;--line:#2e343b;--accent:#7cb3ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{padding:16px;max-width:1400px;margin:0 auto}
a{color:var(--accent)}
nav a{margin-right:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head>
<body>
<main>
<nav id="nav" class="card"></nav>
<div id="view">Loading…</div>
</main>
<script>
var ROUTES=[["#/","Overview"],["#/textures","Textures"],["#/audio","Audio"],["#/sprites","UI Sprites"],["#/data","Game Data"]];
function esc(s){return String(s==null?"":s);}
function h(el,txt){var e=document.createElement(el);e.textContent=txt;return e;}
function buildNav(){var n=document.getElementById("nav");n.textContent="";
 ROUTES.forEach(function(r){var a=document.createElement("a");a.href=r[0];a.textContent=r[1];n.appendChild(a);});}
function render(){
 var v=document.getElementById("view");v.textContent="";
 var route=location.hash||"#/";
 var el=h("p","Route: "+route+" (manifest pending)");
 v.appendChild(el);
}
window.addEventListener("hashchange",render);
buildNav();render();
</script>
</body></html>
